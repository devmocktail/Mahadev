# Netlify deployment configuration for Mahadev Eventz (Angular 20)
[build]
  command = "npm run build"
  # Angular's application builder emits the site into the `browser` subfolder
  publish = "dist/mahadev-eventz/browser"

[build.environment]
  # Angular 20 requires Node 20.19+ / 22.12+
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Caching
#
# Angular hashes every JS/CSS filename (outputHashing: "all"), so those can be
# cached forever — a deploy changes the name. index.html must always be
# revalidated or visitors keep booting the previous deploy's bundle. Images
# under /assets keep stable names, so they get a week with background
# revalidation rather than immutable.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Subset icon fonts change only when the icon set does, and are tiny.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# SPA fallback: let the Angular router handle all deep links (e.g. /gallery)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
