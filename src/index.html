<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>Mahadev Eventz | Premium Event Decoration &amp; Planning</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Hand scroll position to the router (see withInMemoryScrolling) instead
         of letting the browser restore a stale offset before Angular boots. -->
    <script>
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>

    <!-- Primary SEO -->
    <meta name="description" content="Mahadev Eventz creates unforgettable celebrations with premium balloon &amp; flower decoration, birthdays, anniversaries, proposals and festival events. We make your moments unforgettable." />
    <meta name="keywords" content="event management, balloon decoration, flower decoration, birthday decoration, anniversary setup, proposal decor, surprise events, Mahadev Eventz" />
    <meta name="author" content="Mahadev Eventz" />
    <meta name="theme-color" content="#0B0B0B" />
    <link rel="canonical" href="https://mahadeveventz.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mahadev Eventz | We Make Your Moments Unforgettable" />
    <meta property="og:description" content="Premium luxury event decoration &amp; planning. Birthdays, anniversaries, proposals, festivals and more." />
    <meta property="og:image" content="/assets/images/og-cover.svg" />
    <meta property="og:url" content="https://mahadeveventz.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahadev Eventz | We Make Your Moments Unforgettable" />
    <meta name="twitter:description" content="Premium luxury event decoration &amp; planning." />
    <meta name="twitter:image" content="/assets/images/og-cover.svg" />

    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Warm up the Google Fonts origins before the stylesheet is needed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- The hero image is the LCP element: fetch it in parallel with the JS,
         picking the same variant the <picture> element will settle on.
         Regenerated by `npm run images:optimize` — do not edit by hand. -->
    <!-- lcp-preload:start -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/assets/images/hero/hero-event-400.webp 400w, /assets/images/hero/hero-event-600.webp 600w, /assets/images/hero/hero-event-736.webp 736w"
      imagesizes="(min-width: 1024px) 45vw, 90vw"
      fetchpriority="high"
    />
    <!-- lcp-preload:end -->

    <!-- Self-hosted Font Awesome subset: 5.5KB covering the 45 icons this site
         uses, instead of a ~100KB stylesheet plus 274KB of webfonts from a
         third-party CDN. Bundled into styles.css and preloaded here, so icons
         are ready as the page paints rather than arriving seconds later as
         empty boxes. Regenerate with `npm run icons:build`. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/fa-solid-900-subset.woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/fa-brands-400-subset.woff2"
      crossorigin="anonymous"
    />

    <!-- Display/body webfonts load non-blocking: a third-party round trip
         would otherwise hold up first paint. `display=swap` plus the
         system-font fallbacks in tailwind.config.js mean text renders
         immediately either way. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" onload="this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" /></noscript>

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Mahadev Eventz",
        "image": "https://mahadeveventz.com/assets/images/logo.svg",
        "description": "Premium event decoration and planning company specialising in balloon decoration, flower decoration, birthdays, anniversaries, proposals and festivals.",
        "telephone": "+91-9030630508",
        "priceRange": "₹₹",
        "slogan": "We Make Your Moments Unforgettable",
        "areaServed": "India",
        "sameAs": [
          "https://instagram.com/mahadeveventz",
          "https://facebook.com/mahadeveventz"
        ]
      }
    </script>
  </head>
  <body>
    <app-root>
      <!-- Initial paint loader (replaced once Angular boots) -->
      <div class="app-prebloom">
        <div class="app-prebloom__ring"></div>
        <p class="app-prebloom__brand">MAHADEV EVENTZ</p>
      </div>
    </app-root>
  </body>
</html>
